name: Android APK

# Builds the Trusted Web Activity wrapper in android/ into an installable APK
# (and a Play-ready AAB). The APK is uploaded as a workflow artifact, and
# attached to the GitHub Release when the run was triggered by one.
#
# Signing: set the ANDROID_KEYSTORE_* secrets to sign with the real release key.
# Without them the build still produces an installable APK signed with the debug
# key — fine for sideloading and testing, but users cannot upgrade in place
# across a key change, and Play will not accept it. See docs/android-apk.md.

on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'Also build an .aab bundle for Play Console'
        type: boolean
        default: false
  release:
    types: [published]
  # workflow_dispatch only works once this file is on the default branch, so
  # changes to the wrapper also build on push — that is how the first APK gets
  # made, and it keeps the wrapper from silently rotting on a feature branch.
  push:
    paths:
      - 'android/**'
      - 'scripts/generate-android-icons.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # The `secrets` context is not available in a step-level `if`, so the
    # keystore is surfaced through job env and the steps test that instead.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Launcher icons are generated from the same SVG source as the PWA icons
      # rather than committed, so the two can never drift apart.
      - name: Generate launcher icons
        run: node --experimental-strip-types scripts/generate-android-icons.ts

      - name: Read app version
        id: version
        run: echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon \
            -PpushusVersionName="${{ steps.version.outputs.name }}" \
            -PpushusVersionCode="${{ github.run_number }}"

      - name: Build AAB
        if: inputs.build_aab || github.event_name == 'release'
        working-directory: android
        run: |
          gradle bundleRelease --no-daemon \
            -PpushusVersionName="${{ steps.version.outputs.name }}" \
            -PpushusVersionCode="${{ github.run_number }}"

      - name: Stage artifacts
        id: stage
        run: |
          mkdir -p out
          VERSION="${{ steps.version.outputs.name }}"
          cp android/app/build/outputs/apk/release/app-release.apk "out/pushus-$VERSION.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/pushus-$VERSION.aab"
          fi
          ls -la out

      # The site's /.well-known/assetlinks.json must carry the fingerprint of
      # whichever key signed this APK, or Android shows a URL bar over the app.
      # Emit a ready-to-commit file so there is nothing to transcribe by hand.
      - name: Emit assetlinks.json for this signing key
        run: |
          FINGERPRINT=$(keytool -printcert -jarfile "out/pushus-${{ steps.version.outputs.name }}.apk" \
            | grep -m1 'SHA256:' | awk '{print $2}')
          echo "Signing certificate SHA-256: $FINGERPRINT"
          # ANDROID_KEYSTORE_PATH is only set when the release keystore decoded.
          if [ -z "$ANDROID_KEYSTORE_PATH" ]; then
            echo "::warning::Signed with the DEBUG key — do not publish this fingerprint. See docs/android-apk.md."
          fi
          cat > out/assetlinks.json <<JSON
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "app.pushus.twa",
                "sha256_cert_fingerprints": ["$FINGERPRINT"]
              }
            }
          ]
          JSON
          cat out/assetlinks.json

          # If the committed assetlinks.json does not list the key that signed
          # THIS apk, Android cannot verify the app and silently falls back to
          # showing a browser URL bar over it — the app still works, so nothing
          # fails loudly and the regression reaches users. Say so here instead.
          if grep -qF "$FINGERPRINT" public/.well-known/assetlinks.json; then
            echo "assetlinks.json lists this signing key — the TWA will run without a URL bar."
          else
            echo "::warning::public/.well-known/assetlinks.json does NOT list this APK's signing key ($FINGERPRINT). The installed app will show a browser URL bar until the site is redeployed with this fingerprint. Note the CI debug key is regenerated on every runner — configure ANDROID_KEYSTORE_BASE64 for a stable key. See docs/android-apk.md."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pushus-android-${{ steps.version.outputs.name }}
          path: out/*
          if-no-files-found: error

      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/* --clobber
